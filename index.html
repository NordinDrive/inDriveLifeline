<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="inDrive Lifeline: interactive prototype with fictional demo data. Not an official inDrive service or emergency response system." />
    <meta name="theme-color" content="#0b0c0e" />
    <title>inDrive Lifeline · Interactive Demo</title>
    <script>
      // Apply the saved Light/Dark theme before first paint (no flash on refresh).
      try {
        var saved = JSON.parse(localStorage.getItem('indrive-lifeline-demo-v2') || 'null');
        document.documentElement.dataset.theme = saved && saved.ui && saved.ui.stage && saved.ui.stage.theme === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
